name: diag-pay-check
on:
  push:
    branches: ['diag/**']
jobs:
  token:
    runs-on: ubuntu-latest
    steps:
      - name: Confere se o token novo e aceito pelo sandbox (imprime so o codigo HTTP)
        env:
          PAGBANK_TOKEN: ${{ secrets.PAGBANK_TOKEN }}
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $PAGBANK_TOKEN" -H "Accept: application/json" "https://sandbox.api.pagseguro.com/checkouts/CHEC_344148D4-26D6-4D38-92D0-CDB05BD5A07B")
          echo "token novo no sandbox -> HTTP $CODE"
          BAD=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer token-invalido-de-teste" -H "Accept: application/json" "https://sandbox.api.pagseguro.com/checkouts/CHEC_344148D4-26D6-4D38-92D0-CDB05BD5A07B")
          echo "token invalido (controle) -> HTTP $BAD"
