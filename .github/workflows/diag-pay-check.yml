name: diag-pay-check
on:
  push:
    branches: ['diag/**']
jobs:
  db:
    runs-on: ubuntu-latest
    steps:
      - name: Pedidos e plano (somente leitura, sem e-mails nem dados pessoais)
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "::add-mask::$DB_URL"
          psql "$DB_URL" -At -F ' | ' -c "SELECT 'pedido', status, plan_id, amount_cents::text, to_char(created_at AT TIME ZONE 'America/Sao_Paulo','DD/MM HH24:MI:SS'), COALESCE(to_char(paid_at AT TIME ZONE 'America/Sao_Paulo','DD/MM HH24:MI:SS'),'-'), COALESCE(left(psp_order_id,9),'-') FROM orders ORDER BY created_at DESC LIMIT 5;" 2>&1 | sed -E 's#postgres(ql)?://[^ ]+#<db-url>#g'
          psql "$DB_URL" -At -F ' | ' -c "SELECT 'eventos_webhook', count(*)::text FROM webhook_events;" 2>&1 | sed -E 's#postgres(ql)?://[^ ]+#<db-url>#g'
          psql "$DB_URL" -At -F ' | ' -c "SELECT 'contas_com_senha', plan, pdf_imports_used::text FROM users WHERE password_hash IS NOT NULL AND password_hash <> '' ORDER BY created_at;" 2>&1 | sed -E 's#postgres(ql)?://[^ ]+#<db-url>#g'
  logs:
    runs-on: ubuntu-latest
    steps:
      - name: Logs do app sobre pagamentos (somente leitura)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '69.62.87.38' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          script: |
            echo "=== hora do servidor (UTC): $(date -u +%H:%M:%S)"
            echo "=== linhas de pagamento nos logs do app (pm2)"
            pm2 logs cvfacil-ng --nostream --lines 800 2>/dev/null | grep -iE "pagbank|assinatura|signature|webhook" | sed -E 's#(Bearer )[A-Za-z0-9._-]+#\1<omitido>#g; s#postgres(ql)?://[^ ]+#<db-url>#g' | tail -20
            echo "=== webhooks no Traefik (ultimas 24h)"
            docker logs --since 24h $(docker ps -q --filter name=easypanel-traefik) 2>&1 | grep -E "pagbank/webhook" | tail -12 | awk '{print $1, $4, $6, $7, $9}'
            echo "=== fim"
