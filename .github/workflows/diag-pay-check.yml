name: diag-pay-check
on:
  push:
    branches: ['diag/**']
jobs:
  pix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exporta o checkout e o pedido pagos por PIX (somente leitura, dados mascarados)
        env:
          PAGBANK_TOKEN: ${{ secrets.PAGBANK_TOKEN }}
        run: |
          CHECKOUT_ID="CHEC_204DFED3-C8EE-4709-9E35-C86CDB69F69A" node diag/pix-export.mjs
