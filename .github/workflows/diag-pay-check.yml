name: diag-pay-check
on:
  push:
    branches: ['diag/**']
jobs:
  methods:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testa a lista de meios de pagamento no checkout do sandbox
        env:
          PAGBANK_TOKEN: ${{ secrets.PAGBANK_TOKEN }}
        run: node diag/methods.mjs
