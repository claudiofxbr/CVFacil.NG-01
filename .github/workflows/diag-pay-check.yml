name: diag-pay-check
on:
  push:
    branches: ['diag/**']
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consulta o checkout no sandbox (somente leitura)
        env:
          DB_URL: ${{ secrets.DATABASE_URL }}
          PAGBANK_TOKEN: ${{ secrets.PAGBANK_TOKEN }}
        run: |
          echo "::add-mask::$DB_URL"
          CID=$(psql "$DB_URL" -At -c "SELECT psp_order_id FROM orders ORDER BY created_at DESC LIMIT 1;" 2>/dev/null)
          echo "checkout consultado: $CID"
          CHECKOUT_ID="$CID" node diag/checkout-status.mjs
