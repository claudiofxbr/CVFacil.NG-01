name: diag-route
on:
  push:
    branches: ['diag/**']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Le a configuracao do Traefik (somente leitura)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '69.62.87.38' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          script: |
            echo "=== regras Host() em main.yaml que citam xavierbr-vps.tech"
            grep -n "xavierbr-vps.tech" /etc/easypanel/traefik/config/main.yaml | head -20
            echo "=== servicos que apontam para 8443 / 3012 / 8095"
            grep -n -B3 -A3 "8443\|3012\|8095" /etc/easypanel/traefik/config/main.yaml | head -40
            echo "=== o cvfacil-ng resolve para este IP?"
            getent hosts cvfacil-ng.xavierbr-vps.tech | head -2
            echo "=== configuracao estatica do traefik (providers)"
            docker inspect $(docker ps -q --filter name=easypanel-traefik) --format '{{json .Args}} {{json .Config.Cmd}}' 2>/dev/null | cut -c1-600
            echo "=== resposta publica atual (cabecalhos)"
            curl -sk -I --max-time 8 https://cvfacil-ng.xavierbr-vps.tech/ | head -8
