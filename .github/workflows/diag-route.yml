name: diag-route
on:
  push:
    branches: ['diag/**']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Le a configuracao de roteamento (somente leitura)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '69.62.87.38' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          script: |
            echo "=== arquivos que citam o host antigo (cvfacil-ng.xavierbr)"
            grep -rIl "cvfacil-ng.xavierbr" /etc /opt /root /srv /var/lib/docker/volumes 2>/dev/null | grep -v "/node_modules/" | head -20
            echo "=== containers (nomes) cvfacil/traefik"
            docker ps -a --format '{{.Names}} {{.Status}}' 2>/dev/null | grep -iE "cvfacil|traefik" | head -20
            echo "=== nginx sites que citam cvfacil"
            grep -rl "cvfacil" /etc/nginx 2>/dev/null | head
            echo "=== quem escuta 80/443"
            ss -ltnp 2>/dev/null | grep -E ":(80|443) " | sed -E 's/users:\(\(//' | head -5
