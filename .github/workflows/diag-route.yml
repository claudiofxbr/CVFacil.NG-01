name: diag-route
on:
  push:
    branches: ['diag/**']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Le a configuracao do Traefik (somente leitura)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '69.62.87.38' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          script: |
            echo "=== arquivos de config do traefik"
            ls -la /etc/easypanel/traefik/ /etc/easypanel/traefik/config 2>/dev/null | head -30
            echo "=== quais citam cvfacil (exceto acme.json)"
            grep -rIl "cvfacil" /etc/easypanel/traefik 2>/dev/null | grep -v acme.json | head
            for f in $(grep -rIl "cvfacil" /etc/easypanel/traefik 2>/dev/null | grep -v acme.json | head -3); do echo "----- $f"; grep -viE "token|secret|password|key" "$f" | head -70; done
            echo "=== quem escuta 8443 / 3012 / 8095 / 3003"
            ss -ltnp 2>/dev/null | grep -E ":(8443|3012|8095|3003) " | sed -E 's/users:\(\(//' | head -8
            echo "=== processos caddy"
            pgrep -a caddy 2>/dev/null | head -3
            systemctl is-active caddy 2>/dev/null
