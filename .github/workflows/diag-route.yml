name: diag-route
on:
  push:
    branches: ['diag/**']
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Le a configuracao do Traefik (somente leitura)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || '69.62.87.38' }}
          username: ${{ secrets.VPS_USER || 'root' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: false
          script: |
            echo "=== trechos de main.yaml com cvfacil-ng"
            grep -n -B6 -A14 "cvfacil-ng" /etc/easypanel/traefik/config/main.yaml | grep -viE "token|secret|password|key" | head -90
            echo "=== o traefik le a pasta config como diretorio (provider)?"
            docker inspect $(docker ps -q --filter name=easypanel-traefik) --format '{{range .Config.Cmd}}{{println .}}{{end}}' 2>/dev/null | grep -iE "providers|file|watch|directory" | head
